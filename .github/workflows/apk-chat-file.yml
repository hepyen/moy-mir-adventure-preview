name: Export Android APK to ChatGPT
on:
  workflow_dispatch:
jobs:
  package-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch signed APK 2.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.8.0 --repo hepyen/moy-mir-adventure-preview --pattern 'MOY_MIR_2.8.0_TEST.apk' --dir .
          echo '644fef82c0141464708884dd8bf8dedfa519d39ddfb1f32e60b020a2691e0b2d  MOY_MIR_2.8.0_TEST.apk' | sha256sum -c -
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOY_MIR_2_8_0_APK
          path: MOY_MIR_2.8.0_TEST.apk
          retention-days: 2
