name: Export Android APK to ChatGPT
on:
  workflow_dispatch:
jobs:
  package-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch signed APK 2.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.8.2 --repo hepyen/moy-mir-adventure-preview --pattern 'MOY_MIR_2.8.2_TEST.apk' --dir .
          echo '412c3ea64b8d1a30cddfea0330c35de5dfd24c784f59b78ca902787c0738dae1  MOY_MIR_2.8.2_TEST.apk' | sha256sum -c -
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOY_MIR_2_8_2_APK
          path: MOY_MIR_2.8.2_TEST.apk
          retention-days: 2
