name: Publish My World OTA 3.8.3
on:
  push:
    tags:
      - "v3.8.3"
permissions:
  contents: write
jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build OTA web bundle
        run: npm run build
      - name: Package web assets at archive root
        run: |
          cd dist
          zip -q -r "$RUNNER_TEMP/MOY_MIR_3.8.3_OTA.zip" .
      - name: Verify archive and checksum
        run: |
          test "$(unzip -Z1 "$RUNNER_TEMP/MOY_MIR_3.8.3_OTA.zip" | grep -cx 'index.html')" -eq 1
          cd "$RUNNER_TEMP"
          sha256sum MOY_MIR_3.8.3_OTA.zip > MOY_MIR_3.8.3_OTA.zip.sha256
      - name: Publish the OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.8.3             "$RUNNER_TEMP/MOY_MIR_3.8.3_OTA.zip"             "$RUNNER_TEMP/MOY_MIR_3.8.3_OTA.zip.sha256"             --repo hepyen/moy-mir-adventure-preview             --verify-tag             --title "Мой мир 3.8.3 · Будильник Ильи"             --notes-file RELEASE_3.8.3.md
